<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GANYANT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Krona+One&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='30' fill='%23000000'/><text x='50%' y='55%' dominant-baseline='central' text-anchor='middle' fill='%23ffffff' font-family='sans-serif' font-weight='bold' font-size='65'>G</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            position: fixed;
            background-color: #040404;
            color: #ffffff;
            font-family: 'Krona One', sans-serif;
        }
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .cyber-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 150vw;
            height: 150vh;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, rgba(25, 25, 30, 0.4) 0%, rgba(4, 4, 4, 1) 50%);
            z-index: 0;
            animation: breathe 8s infinite alternate ease-in-out;
        }
        .noise {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.03;
            z-index: 1;
            pointer-events: none;
        }
        .scanlines {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(255,255,255,0) 50%, rgba(0,0,0,0.2) 50%);
            background-size: 100% 4px;
            z-index: 2;
            pointer-events: none;
        }
        @keyframes breathe {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.7; }
            100% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
        }
        .content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
        }
        h1 {
            font-size: clamp(2.5rem, 8vw, 5.5rem);
            letter-spacing: 0.4rem;
            cursor: default;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
        }
        .contact-email {
            color: #555555;
            font-size: clamp(0.9rem, 2vw, 1.2rem);
            text-decoration: none;
            letter-spacing: 0.1rem;
            cursor: pointer;
            transition: all 0.4s ease;
        }
        .contact-email:hover {
            color: #ffffff;
            letter-spacing: 0.2rem;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body>
    <div class="cyber-glow"></div>
    <div class="noise"></div>
    <div class="scanlines"></div>
    <div class="content">
        <h1>GANYANT</h1>
        <a href="mailto:contact@ganyant.com" class="contact-email">contact@ganyant.com</a>
    </div>
</body>
</html>
